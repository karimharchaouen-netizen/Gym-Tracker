<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Tracker Pro</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f5f7fa;
}
header{
    background:#0a6ed1;
    color:#fff;
    padding:14px;
    font-size:22px;
}
#a{
    padding:12px;
}
.card,.tile{
    background:#fff;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}
button{
    padding:8px 10px;
    margin:2px;
    border:none;
    border-radius:8px;
    background:#0a6ed1;
    color:#fff;
}
input,select{
    width:100%;
    box-sizing:border-box;
    padding:8px;
}
.red{
    background:#d32f2f;
}
.green{
    background:#2e7d32;
}
.purple{
    background:#8e24aa;
}
table{
    width:100%;
    border-collapse:collapse;
}
td,th{
    border:1px solid #ddd;
    padding:4px;
    text-align:center;
}
.small{
    font-size:12px;
    color:#666;
}
.nav{
    display:flex;
    gap:5px;
    align-items:center;
}
.counter{
    text-align:center;
    font-weight:bold;
    margin-bottom:10px;
}
</style>
</head>
<body>

<header>🏋️ Gym Tracker Pro</header>

<div id="a"></div>

<script>

let S = JSON.parse(localStorage.getItem('splits')||'[]');
let H = JSON.parse(localStorage.getItem('history')||'[]');

let WH = JSON.parse(
    localStorage.getItem('workouts') || '[]'
);

const a = document.getElementById('a');

const save = ()=>{
    localStorage.setItem('splits',JSON.stringify(S));
    localStorage.setItem('history',JSON.stringify(H));
    localStorage.setItem('workouts',JSON.stringify(WH));
};

function home(){

    a.innerHTML=`
        <div class="tile" onclick="m()">
            Training erstellen/anpassen
        </div>

        <div class="tile" onclick="start()">
            Training starten
        </div>

        <div class="tile" onclick="hist()">
            Historie
        </div>
    `;
}

function m(){

    a.innerHTML=`
        <button onclick="home()">Zurück</button>

        <div class="tile" onclick="ns()">
            Split erstellen
        </div>

        <div class="tile" onclick="ls()">
            Splits bearbeiten
        </div>
    `;
}

function ns(){

    a.innerHTML=`
        <button onclick="m()">Zurück</button>

        <div class="card">

            <input id="n" placeholder="Push">

            <button onclick="
                S.push({
                    name:n.value,
                    exercises:[]
                });

                save();
                ls();
            ">
                Speichern
            </button>

        </div>
    `;
}

function ls(){

    let h=`<button onclick="m()">Zurück</button>`;

    S.forEach((s,i)=>{

        h += `
        <div class="card">
            <b>${s.name}</b>

            <button onclick="ed(${i})">
                Bearbeiten
            </button>
        </div>
        `;
    });

    a.innerHTML=h;
}

function ed(i){

    let s=S[i];

    let h=`
        <button onclick="ls()">Zurück</button>

        <div class="card">

        <h3>${s.name}</h3>
    `;

    s.exercises.forEach((e,x)=>{

        h += `
        ${e.name} (${e.sets})

        <button onclick="up(${i},${x})">⬆️</button>
        <button onclick="down(${i},${x})">⬇️</button>

        <button
            class="red"
            onclick="del(${i},${x})">

            X

        </button>

        <button onclick="chg(${i},${x})">
            Bearbeiten
        </button>

        <br>
        `;
    });

    h += `
        <hr>

        <input id="en" placeholder="Übung">

        <input id="sets"
               type="number"
               value="3">

        <button onclick="add(${i})">
            Hinzufügen
        </button>

        </div>
    `;

    a.innerHTML=h;
}

function add(i){

    S[i].exercises.push({
        name:en.value,
        sets:+sets.value
    });

    save();

    ed(i);
}

function del(i,x){

    S[i].exercises.splice(x,1);

    save();

    ed(i);
}

function up(i,x){

    if(x){

        [S[i].exercises[x-1],
         S[i].exercises[x]]

         =

        [S[i].exercises[x],
         S[i].exercises[x-1]];

        save();

        ed(i);
    }
}

function down(i,x){

    if(x<S[i].exercises.length-1){

        [S[i].exercises[x+1],
         S[i].exercises[x]]

         =

        [S[i].exercises[x],
         S[i].exercises[x+1]];

        save();

        ed(i);
    }
}

function chg(i,x){

    let n =
        prompt(
            'Name',
            S[i].exercises[x].name
        );

    let s =
        prompt(
            'Sätze',
            S[i].exercises[x].sets
        );

    if(n){

        S[i].exercises[x]={
            name:n,
            sets:+s
        };
    }

    save();

    ed(i);
}

function start(){

    let h=`
        <button onclick="home()">
            Zurück
        </button>
    `;

    S.forEach((s,i)=>{

        h += `
        <div class="tile" onclick="run(${i})">
            ${s.name}
        </div>
        `;
    });

    a.innerHTML=h;
}

function last2(name){

    return H
        .filter(x=>x.exercise===name)
        .slice(-2)
        .reverse();
}





function run(i){

    

window.W =
    JSON.parse(
        JSON.stringify(S[i])
    );

W.exercises.forEach(e=>{
    e.loggedSets = [];
});

    window.currentExercise = 0;

    draw();
}










function draw(){

    let w = W;
    let e = w.exercises[currentExercise];

    let l = last2(e.name);

    let h = `
        <button onclick="start()">
            Zurück
        </button>

        <h2>${w.name}</h2>

        <div class="card">

        <div class="counter">
            Übung ${currentExercise+1}
            von
            ${w.exercises.length}
        </div>

        <div class="nav">

            <button onclick="prevExercise()">
                ◀️
            </button>

            <select
                onchange="jumpExercise(this.value)"
                style="flex:1">

                ${w.exercises.map((x,i)=>`
                    <option
                        value="${i}"
                        ${i===currentExercise?'selected':''}>
                        ${x.name}
                    </option>
                `).join('')}

            </select>

            <button onclick="nextExercise()">
                ▶️
            </button>

        </div>

        <h3>${e.name}</h3>

	<button
    class="red"
    onclick="deleteCurrentExercise()">
    Übung entfernen
</button>

    `;






if(l[0]){
    h += `
    <div class="small">
        Letzte:
${(l[0].weights || [])
    .map((w,i)=>
        `${w}kg x ${l[0].reps[i]}`
    )
    .join('<br>')}
    </div>`;
}else{
    h += `
    <div class="small">
        Noch kein vorheriges Training
    </div>`;
}






if(l[1]){
    h += `
    <div class="small">
        Vorletzte:
${(l[1].weights || [])
    .map((w,i)=>
        `${w}kg x ${l[1].reps[i]}`
    )
    .join('<br>')}
    </div>`;
}else{
    h += `
    <div class="small">
        Kein vorletztes Training vorhanden
    </div>`;
}







    h += `
    <table>

        <tr>
            <th>Satz</th>
            <th>Gewicht</th>
            <th>Wdh</th>
        </tr>
    `;

    for(let s=1;s<=e.sets;s++){

        h += `
        <tr>

            <td>${s}</td>

            <td>
<input
 id="w_${currentExercise}_${s}"
 value="${l[0]?.weights?.[s-1] || ''}">
            </td>

            <td>
                <input
                 id="r_${currentExercise}_${s}"
                 oninput="ampel(currentExercise)">
            </td>

        </tr>
        `;
    }

    h += `
    </table>

    <div id="st_${currentExercise}">
        ⚪ Nicht bewertet
    </div>

    <button
        class="green"
        onclick="completeExercise()">

        ✅ Übung abschließen

    </button>

    <button
        onclick="addSet(currentExercise)">

        + Satz

    </button>

    <button
        onclick="removeSet(currentExercise)">

        - Satz

    </button>

    </div>

    <div class="card">

        <input id="ne"
               placeholder="Neue Übung">

        <input id="nsv"
               type="number"
               value="3">

        <button onclick="


  W.exercises.push({
    name:ne.value,
    sets:+nsv.value,
    loggedSets:[]
});

            draw();
        ">
            Übung hinzufügen
        </button>

    </div>

    <button
        class="green"
        onclick="finish()">

        Training abschließen

    </button>
    `;

    a.innerHTML=h;
}

function prevExercise(){
    if(currentExercise>0){
        currentExercise--;
        draw();
    }
}

function nextExercise(){
    if(currentExercise<W.exercises.length-1){
        currentExercise++;
        draw();
    }
}

function jumpExercise(i){
    currentExercise=parseInt(i);
    draw();
}

function status(rep){

    if(rep.some(x=>x<8))
        return ['🔴','Unter Zielbereich'];

    if(rep.every(x=>x>=12))
        return ['🟣','+2,5kg empfohlen'];

    return ['🟢','Im Zielbereich'];
}

function ampel(i){

    let e=W.exercises[i];

    let r=[];

    for(let s=1;s<=e.sets;s++){

        r.push(
            parseInt(
                document.getElementById(
                    'r_'+i+'_'+s
                )?.value||0
            )
        );
    }

    let st=status(r);

    document.getElementById(
        'st_'+i
    ).innerHTML=
        st[0]+" "+st[1];
}

function saveEx(i){

    let e=W.exercises[i];

    let reps=[];

let weights=[];

    for(let s=1;s<=e.sets;s++){

      weights.push(
document.getElementById(
    'w_'+i+'_'+s
).value || ''
);

        reps.push(
            parseInt(
                document.getElementById(
                    'r_'+i+'_'+s
                ).value||0
            )
        );
    }

H.push({
    date:new Date().toLocaleString(),
    exercise:e.name,
    weights:weights,
    reps:reps,
    status:status(reps)[0]
});

    save();
}

function completeExercise(){

let e = W.exercises[currentExercise];

e.loggedSets = [];

for(let s=1;s<=e.sets;s++){

    e.loggedSets.push({

        weight:
        document.getElementById(
            'w_'+currentExercise+'_'+s
        )?.value || "",

        reps:
        parseInt(
            document.getElementById(
                'r_'+currentExercise+'_'+s
            )?.value || 0
        )

    });

}





    saveEx(currentExercise);

    if(
        currentExercise <
        W.exercises.length-1
    ){

        currentExercise++;

        draw();

    } else {

        alert(
            "Alle Übungen erledigt ✅"
        );

    }
}


function deleteCurrentExercise(){

    if(!confirm(
        "Übung wirklich entfernen?"
    )) return;

    W.exercises.splice(
        currentExercise,
        1
    );

    if(
        currentExercise >=
        W.exercises.length
    ){
        currentExercise =
        Math.max(
            0,
            W.exercises.length - 1
        );
    }

    if(W.exercises.length===0){

        alert(
            "Keine Übungen mehr im Training"
        );

        start();

        return;
    }

    draw();
}


function addSet(i){

    W.exercises[i].sets++;

    draw();
}

function removeSet(i){

    if(W.exercises[i].sets>1){

        W.exercises[i].sets--;

        draw();
    }
}

function finish(){

    let workout = {

        date:new Date()
            .toLocaleDateString("de-DE"),

        split:W.name,

        exercises:[]
    };

    W.exercises.forEach((e,i)=>{

        let sets = e.loggedSets || [];

        if(sets.length===0){

            for(let s=1;s<=e.sets;s++){

                sets.push({

                    weight:
                    document.getElementById(
                        'w_'+i+'_'+s
                    )?.value || "",

                    reps:
                    parseInt(
                        document.getElementById(
                            'r_'+i+'_'+s
                        )?.value || 0
                    )

                });

            }

        }

        workout.exercises.push({

            name:e.name,

            sets:sets

        });

    });

    WH.unshift(workout);

    save();

    alert("Training abgeschlossen");

    home();
}

function hist(){

    let h = `
    <button onclick="home()">
        Zurück
    </button>
    `;

    WH.forEach((w,i)=>{

        h += `
        <div class="card">

            <b>
                ${w.split}
                -
                ${w.date}
            </b>

            <button
                onclick="showWorkout(${i})">
                Öffnen
            </button>

        </div>
        `;
    });

    a.innerHTML = h;
}

function showWorkout(i){

    let w = WH[i];

    let h = `
    <button onclick="hist()">
        Zurück
    </button>

    <h2>
        ${w.split}
        -
        ${w.date}
    </h2>
    `;

    w.exercises.forEach(ex=>{

        h += `
        <div class="card">

            <b>${ex.name}</b><br>
        `;

        ex.sets.forEach((s,n)=>{

            h += `
            Satz ${n+1}:
            ${s.weight}kg x ${s.reps}
            <br>
            `;
        });

        h += `
        </div>
        `;
    });

    a.innerHTML = h;
}



home();

</script>

</body>
</html>
